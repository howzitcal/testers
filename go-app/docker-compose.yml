services:
  go-web:
    build: .
    container_name: go-leads-web
    command: ["web"]
    ports:
      - "8003:8003"
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-go_leads}
      HTTP_ADDR: ":8003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  go-worker:
    build: .
    container_name: go-leads-worker
    command: ["worker"]
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-go_leads}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - go-web
    restart: unless-stopped
