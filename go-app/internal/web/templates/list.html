{{define "list.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Go Leads</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">Go Leads</a>
        <a class="btn btn-outline-light btn-sm" href="/leads/new">New Lead</a>
    </div>
</nav>
<main class="container">
    {{if .Message}}
        <div class="alert alert-success">{{.Message}}</div>
    {{end}}
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Leads</h1>
        <a class="btn btn-primary" href="/leads/new">Add Lead</a>
    </div>
    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Status</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            {{range .Leads}}
            <tr>
                <td>{{.ID}}</td>
                <td>{{.Name}}</td>
                <td>{{.Email}}</td>
                <td><span class="badge text-bg-secondary">{{.Status}}</span></td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-primary" href="/leads/{{.ID}}/edit">Edit</a>
                    <form class="d-inline" method="post" action="/leads/{{.ID}}/delete"
                          onsubmit="return confirm('Delete this lead?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </td>
            </tr>
            {{else}}
            <tr>
                <td colspan="5" class="text-muted">No leads yet.</td>
            </tr>
            {{end}}
            </tbody>
        </table>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
{{end}}
