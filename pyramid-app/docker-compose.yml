services:
  pyramid-web:
    build: .
    container_name: pyramid-leads-web
    command: ["web"]
    ports:
      - "6543:6543"
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-pyramid_leads}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  pyramid-worker:
    build: .
    container_name: pyramid-leads-worker
    command: ["worker"]
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-pyramid_leads}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - pyramid-web
    restart: unless-stopped
