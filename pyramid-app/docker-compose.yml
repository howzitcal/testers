services:
  pyramid-web:
    build: .
    container_name: pyramid-leads-web
    command: ["web"]
    ports:
      - "6543:6543"
    volumes:
      - pyramid-data:/app/data
    environment:
      SQLALCHEMY_URL: sqlite:////app/data/leads.db
    restart: unless-stopped

  pyramid-worker:
    build: .
    container_name: pyramid-leads-worker
    command: ["worker"]
    volumes:
      - pyramid-data:/app/data
    environment:
      SQLALCHEMY_URL: sqlite:////app/data/leads.db
      SCHEDULER_JOBSTORE_URL: sqlite:////app/data/apscheduler.db
    depends_on:
      - pyramid-web
    restart: unless-stopped

volumes:
  pyramid-data:
