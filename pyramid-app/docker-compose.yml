services:
  mysql:
    image: mysql:8.4
    container_name: pyramid-leads-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_NAME:-pyramid_leads}
    volumes:
      - pyramid-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-password}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  pyramid-web:
    build: .
    container_name: pyramid-leads-web
    command: ["web"]
    ports:
      - "6543:6543"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-pyramid_leads}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  pyramid-worker:
    build: .
    container_name: pyramid-leads-worker
    command: ["worker"]
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-pyramid_leads}
    depends_on:
      mysql:
        condition: service_healthy
      pyramid-web:
        condition: service_started
    restart: unless-stopped

volumes:
  pyramid-mysql-data:
