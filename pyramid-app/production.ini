[app:main]
use = egg:leads_app
pyramid.reload_templates = false
pyramid.debug_authorization = false
pyramid.debug_notfound = false
pyramid.debug_routematch = false
pyramid.default_locale_name = en
jinja2.directories = leads_app:templates
sqlalchemy.url = sqlite:////app/data/leads.db
scheduler.jobstore.url = sqlite:////app/data/apscheduler.db

[server:main]
use = egg:waitress#main
listen = *:6543

[loggers]
keys = root, leads_app

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_leads_app]
level = INFO
handlers =
qualname = leads_app

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s:%(lineno)s][%(threadName)s] %(message)s
