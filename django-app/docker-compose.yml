services:
  django-web:
    build: .
    container_name: django-leads-web
    command: ["web"]
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-django_leads}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  django-qcluster:
    build: .
    container_name: django-leads-qcluster
    command: ["qcluster"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-django_leads}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - django-web
    restart: unless-stopped
