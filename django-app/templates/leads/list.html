{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Leads</h1>
    <a class="btn btn-success" href="{% url 'lead_create' %}">Add Lead</a>
</div>

<div class="table-responsive">
    <table class="table table-striped align-middle">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Status</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        {% for lead in leads %}
        <tr>
            <td>{{ lead.id }}</td>
            <td>{{ lead.name }}</td>
            <td>{{ lead.email }}</td>
            <td><span class="badge text-bg-secondary">{{ lead.status }}</span></td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-primary" href="{% url 'lead_edit' lead.pk %}">Edit</a>
                <form class="d-inline" method="post" action="{% url 'lead_delete' lead.pk %}"
                      onsubmit="return confirm('Delete this lead?');">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5" class="text-muted">No leads yet.</td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
