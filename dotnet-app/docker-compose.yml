services:
  dotnet-web:
    build: .
    container_name: dotnet-leads-web
    command: ["web"]
    ports:
      - "8008:8008"
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-dotnet_leads}
      HTTP_PORT: "8008"
      ASPNETCORE_URLS: http://0.0.0.0:8008
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  dotnet-worker:
    build: .
    container_name: dotnet-leads-worker
    command: ["worker"]
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-dotnet_leads}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - dotnet-web
    restart: unless-stopped
